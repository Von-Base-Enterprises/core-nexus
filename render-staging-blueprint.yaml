# Enhanced Render Blueprint - JARVIS-Scale Memory Service
# Production + Staging + Preview Environments (2025 Best Practices)

databases:
  # Production Database (existing)
  - name: nexus-memory-db-prod
    plan: standard  # High performance
    databaseName: nexus_memory_db
    user: nexus_memory_db_user
    ipAllowList: []
    
  # NEW: Staging Database
  - name: nexus-memory-db-staging  
    plan: starter   # Lower cost for staging
    databaseName: nexus_memory_db_staging
    user: nexus_memory_db_user
    ipAllowList: []

  # NEW: Redis for Rate Limiting & Caching
  - name: nexus-redis-prod
    plan: standard
    
  - name: nexus-redis-staging
    plan: starter

services:
  # PRODUCTION SERVICE (Enhanced)
  - type: web
    name: core-nexus-memory-service
    env: production
    plan: standard  # Upgraded from starter
    runtime: python3
    region: oregon
    branch: main
    rootDir: python/memory_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.memory_service.api:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health
    autoDeploy: false  # Manual deploys for production safety
    envVars:
      - key: SERVICE_NAME
        value: core-nexus-memory-service-prod
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DEBUG_MODE
        value: false
      # Database (Production)
      - key: PGVECTOR_HOST
        fromDatabase:
          name: nexus-memory-db-prod
          property: host
      - key: PGVECTOR_PORT
        fromDatabase:
          name: nexus-memory-db-prod
          property: port
      - key: PGVECTOR_DATABASE
        fromDatabase:
          name: nexus-memory-db-prod
          property: database
      - key: PGVECTOR_USER
        fromDatabase:
          name: nexus-memory-db-prod
          property: user
      - key: PGVECTOR_PASSWORD
        fromDatabase:
          name: nexus-memory-db-prod
          property: password
      # Redis (Production)
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexus-redis-prod
          property: connectionString
      # Feature flags
      - key: GRAPH_ENABLED
        value: true
      - key: ADM_EVOLUTION_ENABLED
        value: true
      - key: ADM_SCORING_ENABLED
        value: true
      - key: OTEL_SDK_DISABLED
        value: true
      # Performance
      - key: WORKERS
        value: "2"
      - key: MAX_CONNECTIONS
        value: "100"
      - key: QUERY_TIMEOUT_MS
        value: "5000"
      - key: CORS_ORIGINS
        value: "*"

  # NEW: STAGING SERVICE
  - type: web
    name: core-nexus-memory-service-staging
    env: staging
    plan: starter   # Lower cost
    runtime: python3
    region: oregon  
    branch: staging  # Will deploy from staging branch
    rootDir: python/memory_service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.memory_service.api:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    autoDeploy: true   # Auto-deploy staging for rapid testing
    envVars:
      - key: SERVICE_NAME
        value: core-nexus-memory-service-staging
      - key: ENVIRONMENT
        value: staging
      - key: LOG_LEVEL
        value: DEBUG
      - key: DEBUG_MODE
        value: true
      # Database (Staging)
      - key: PGVECTOR_HOST
        fromDatabase:
          name: nexus-memory-db-staging
          property: host
      - key: PGVECTOR_PORT
        fromDatabase:
          name: nexus-memory-db-staging
          property: port
      - key: PGVECTOR_DATABASE
        fromDatabase:
          name: nexus-memory-db-staging
          property: database
      - key: PGVECTOR_USER
        fromDatabase:
          name: nexus-memory-db-staging
          property: user
      - key: PGVECTOR_PASSWORD
        fromDatabase:
          name: nexus-memory-db-staging
          property: password
      # Redis (Staging)
      - key: REDIS_URL
        fromService:
          type: redis
          name: nexus-redis-staging
          property: connectionString
      # Feature flags (same as prod for testing)
      - key: GRAPH_ENABLED
        value: true
      - key: ADM_EVOLUTION_ENABLED
        value: true
      - key: ADM_SCORING_ENABLED
        value: true
      - key: OTEL_SDK_DISABLED
        value: true
      # Performance (lower for staging)
      - key: WORKERS
        value: "1"
      - key: MAX_CONNECTIONS
        value: "50"
      - key: QUERY_TIMEOUT_MS
        value: "10000"  # Higher timeout for debugging
      - key: CORS_ORIGINS
        value: "*"

  # Keep-alive Workers (both environments)
  - type: worker
    name: core-nexus-keep-alive-prod
    env: production
    plan: starter
    runtime: python3
    region: oregon
    branch: main
    rootDir: python/memory_service
    buildCommand: pip install httpx asyncio
    startCommand: python worker/keep_alive.py
    envVars:
      - key: API_URL
        value: https://core-nexus-memory-service.onrender.com
      - key: PING_SEC
        value: "300"

  - type: worker
    name: core-nexus-keep-alive-staging
    env: staging
    plan: starter
    runtime: python3
    region: oregon
    branch: staging
    rootDir: python/memory_service
    buildCommand: pip install httpx asyncio
    startCommand: python worker/keep_alive.py
    envVars:
      - key: API_URL
        value: https://core-nexus-memory-service-staging.onrender.com
      - key: PING_SEC
        value: "600"  # Less frequent pings for staging

# Preview Environments for Feature Branch Testing
previewsEnabled: true
previewsExpireAfterDays: 3

# Environments for access control
environments:
  - name: production
    protected: true  # Only admins can deploy
  - name: staging
    protected: false # Developers can deploy
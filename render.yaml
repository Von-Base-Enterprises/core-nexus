services:
  # Main Core Nexus Memory Service
  - type: web
    name: core-nexus-memory-service
    env: python
    region: oregon
    plan: starter
    branch: main
    rootDir: python/memory_service
    buildCommand: pip install -r requirements.txt
    startCommand: ./scripts/startup.sh
    healthCheckPath: /health
    envVars:
      - key: SERVICE_NAME
        value: core-nexus-memory-prod
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: WORKERS
        value: "3"
      - key: MAX_CONNECTIONS
        value: "100"
      - key: QUERY_TIMEOUT_MS
        value: "5000"
      - key: ENABLE_METRICS
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: GRAPH_ENABLED
        value: "true"
      - key: PINECONE_API_KEY
        value: ""
      # OPENAI_API_KEY should be set in Render.com dashboard for security
      # Do not hardcode API keys in render.yaml
      - key: PGVECTOR_HOST
        value: dpg-d12n0np5pdvs73ctmm40-a
      - key: PGVECTOR_DATABASE
        value: nexus_memory_db
      - key: PGVECTOR_USER
        value: nexus_memory_db_user
      # PGVECTOR_PASSWORD must be set in the dashboard for security
      - key: REDIS_URL
        fromService:
          type: redis
          name: core-nexus-redis-cache
          property: connectionString

  # Keep-alive Background Worker
  - type: worker
    name: core-nexus-keep-alive
    env: python
    region: oregon
    plan: starter
    branch: main
    rootDir: python/memory_service
    buildCommand: pip install httpx asyncio
    startCommand: python worker/keep_alive.py
    envVars:
      - key: API_URL
        value: https://core-nexus-memory-service.onrender.com
      - key: PING_SEC
        value: "300"
      - key: PING_TIMEOUT
        value: "10"
      - key: PING_RETRIES
        value: "3"

  # Prometheus Monitoring
  - type: web
    name: core-nexus-prometheus
    env: docker
    region: oregon
    plan: starter
    branch: main
    rootDir: python/memory_service/monitoring
    dockerfilePath: ./prometheus.Dockerfile
    envVars:
      - key: CORE_NEXUS_URL
        value: https://core-nexus-memory-service.onrender.com

  # Grafana Dashboard
  - type: web
    name: core-nexus-grafana
    env: docker
    region: oregon
    plan: starter
    branch: main
    rootDir: python/memory_service/monitoring
    dockerfilePath: ./grafana.Dockerfile
    envVars:
      - key: GF_SECURITY_ADMIN_PASSWORD
        value: admin123
      - key: PROMETHEUS_URL
        value: https://core-nexus-prometheus.onrender.com

  # Redis Cache Service
  - type: redis
    name: core-nexus-redis-cache
    region: oregon
    plan: starter
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []  # Allow access from all Render services
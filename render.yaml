services:
  # Main Core Nexus Memory Service
  - type: web
    name: core-nexus-memory-service
    env: python
    region: oregon
    plan: starter
    branch: main
    rootDir: python/memory_service
    buildCommand: pip install --no-cache-dir -r requirements.txt && python -c "import aiofiles; print('✅ aiofiles imported successfully')"
    startCommand: uvicorn src.memory_service.api:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: SERVICE_NAME
        value: core-nexus-memory-prod
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: WORKERS
        value: "3"
      - key: MAX_CONNECTIONS
        value: "100"
      - key: QUERY_TIMEOUT_MS
        value: "5000"
      - key: ENABLE_METRICS
        value: "true"
      - key: CORS_ORIGINS
        value: "*"
      - key: GRAPH_ENABLED
        value: "true"
      - key: PINECONE_API_KEY
        value: ""
      # OPENAI_API_KEY should be set in Render.com dashboard for security
      # Do not hardcode API keys in render.yaml
      # Deduplication Configuration
      - key: DEDUPLICATION_MODE
        value: "off"  # Options: off, log_only, active - Start with 'off' for safety
      - key: DEDUP_SIMILARITY_THRESHOLD
        value: "0.95"  # 95% similarity threshold for semantic duplicates
      - key: DEDUP_EXACT_MATCH_ONLY
        value: "false"  # Enable semantic similarity checking
      - key: ADMIN_KEY
        sync: false  # Set this in Render dashboard for security
      - key: PGVECTOR_HOST
        value: dpg-d12n0np5pdvs73ctmm40-a
      - key: PGVECTOR_DATABASE
        value: nexus_memory_db
      - key: PGVECTOR_USER
        value: nexus_memory_db_user
      - key: TABLE_NAME
        value: vector_memories_optimized  # OPTIMIZATION: Use 1,536D vectors
      # PGVECTOR_PASSWORD must be set in the dashboard for security

  # Keep-alive Background Worker
  - type: worker
    name: core-nexus-keep-alive
    env: python
    region: oregon
    plan: starter
    branch: main
    rootDir: python/memory_service
    buildCommand: pip install httpx asyncio
    startCommand: python worker/keep_alive.py
    envVars:
      - key: API_URL
        value: https://core-nexus-memory-service.onrender.com
      - key: PING_SEC
        value: "300"
      - key: PING_TIMEOUT
        value: "10"
      - key: PING_RETRIES
        value: "3"

  # Prometheus Monitoring
  - type: web
    name: core-nexus-prometheus
    env: docker
    region: oregon
    plan: starter
    branch: main
    rootDir: python/memory_service/monitoring
    dockerfilePath: ./prometheus.Dockerfile
    envVars:
      - key: CORE_NEXUS_URL
        value: https://core-nexus-memory-service.onrender.com

  # Grafana Dashboard
  - type: web
    name: core-nexus-grafana
    env: docker
    region: oregon
    plan: starter
    branch: main
    rootDir: python/memory_service/monitoring
    dockerfilePath: ./grafana.Dockerfile
    envVars:
      - key: GF_SECURITY_ADMIN_PASSWORD
        value: admin123
      - key: PROMETHEUS_URL
        value: https://core-nexus-prometheus.onrender.com
  # JARVIS AI Agent Service
  - type: web
    name: jarvis-ai-agent
    env: python
    region: oregon
    plan: starter
    branch: main
    rootDir: jarvis
    buildCommand: pip install -r requirements.txt
    startCommand: cd src && uvicorn jarvis.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GEMINI_API_KEY
        sync: false  # Set this in Render dashboard for security
      - key: CORE_NEXUS_URL
        value: https://core-nexus-memory-service.onrender.com
      - key: JARVIS_DEBUG
        value: "false"
      - key: JARVIS_LOG_LEVEL
        value: "INFO"
      - key: LANGGRAPH_CHECKPOINT_BACKEND
        value: "memory"

  # JARVIS Health Monitoring Service
  - type: worker
    name: jarvis-health-monitor
    env: python
    region: oregon
    plan: starter
    branch: main
    rootDir: ./
    buildCommand: pip install httpx asyncio
    startCommand: python jarvis_health_monitor.py
    envVars:
      - key: JARVIS_URL
        value: https://jarvis-ai-agent-aa4m.onrender.com
      - key: CORE_NEXUS_URL
        value: https://core-nexus-memory-service.onrender.com
      - key: CHECK_INTERVAL
        value: "300"  # 5 minutes
      - key: LOG_LEVEL
        value: "INFO"
      - key: ALERT_WEBHOOK_URL
        sync: false  # Set Slack/Discord webhook URL in Render dashboard
      - key: ALERT_EMAIL
        sync: false  # Set alert email in Render dashboard
      - key: SMTP_USER
        sync: false  # Set SMTP user in Render dashboard
      - key: SMTP_PASSWORD
        sync: false  # Set SMTP password in Render dashboard
